name: Publish Alpha 2 to PyPI

on:
  workflow_dispatch:

jobs:
  publish:
    name: Publish codex-rescue 0.1.0a2
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi

    steps:
      - name: Checkout exact tagged commit
        uses: actions/checkout@v4
        with:
          ref: bfc3ff18c5bbb251fda350940a19beb8bd2b6c19
          fetch-depth: 0

      - name: Verify checkout and tag identity
        shell: bash
        run: |
          set -euo pipefail
          expected='bfc3ff18c5bbb251fda350940a19beb8bd2b6c19'
          test "$(git rev-parse HEAD)" = "$expected"
          test "$(git rev-parse 'refs/tags/v0.1.0-alpha.2^{}')" = "$expected"

      - name: Download exact assets from the draft GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.0-alpha.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          gh api \
            --header 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/releases/369967130" \
            > release.json

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("release.json").read_text(encoding="utf-8"))
          expected_tag = os.environ["RELEASE_TAG"]
          expected_assets = {
              "codex_rescue-0.1.0a2-py3-none-any.whl",
              "codex_rescue-0.1.0a2.tar.gz",
          }
          if data.get("draft") is not True:
              raise SystemExit("release must already be a draft")
          if data.get("tag_name") != expected_tag or data.get("name") != expected_tag:
              raise SystemExit("draft release tag/title mismatch")
          assets = data.get("assets", [])
          names = [asset.get("name") for asset in assets]
          if set(names) != expected_assets or len(names) != len(expected_assets):
              raise SystemExit(f"draft release assets mismatch: {names!r}")
          for asset in assets:
              if asset["name"] not in expected_assets or not asset.get("id"):
                  raise SystemExit("draft release asset metadata is incomplete")
          PY

          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          data = json.loads(Path("release.json").read_text(encoding="utf-8"))
          out_dir = Path("dist")
          for asset in data["assets"]:
              name = asset["name"]
              output = out_dir / name
              with output.open("wb") as stream:
                  subprocess.run(
                      [
                          "gh", "api",
                          "--header", "Accept: application/octet-stream",
                          f"/repos/{os.environ['GITHUB_REPOSITORY']}/releases/assets/{asset['id']}",
                      ],
                      check=True,
                      stdout=stream,
                  )
          PY

      - name: Verify exact artifact SHA256
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          printf '%s  %s\n' \
            '18834fc4eced65ce49f1b568fa3db519a1e1ad77e72213bb7d693c9db6776e4a' \
            'dist/codex_rescue-0.1.0a2-py3-none-any.whl' | sha256sum -c -
          printf '%s  %s\n' \
            '1ccffcf19c929cb1b01f313d104d5cde28d2fc2a6097d03bef502a68d438165a' \
            'dist/codex_rescue-0.1.0a2.tar.gz' | sha256sum -c -

      - name: Publish exact artifacts to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
