name: Publish Alpha 3 to PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published GitHub prerelease tag"
        required: true
        default: "v0.1.0-alpha.3"
      expected_version:
        description: "PyPI version encoded in the exact assets"
        required: true
        default: "0.1.0a3"
      wheel_sha256:
        description: "SHA256 of the validated wheel asset"
        required: true
      sdist_sha256:
        description: "SHA256 of the validated sdist asset"
        required: true

jobs:
  publish:
    name: Publish codex-rescue ${{ inputs.expected_version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi

    steps:
      - name: Checkout exact tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Verify checkout and tag identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        shell: bash
        run: |
          set -euo pipefail
          expected="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          test "$(git rev-parse HEAD)" = "$expected"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          expected = os.environ["EXPECTED_VERSION"]
          version = re.search(r'__version__\s*=\s*["\']([^"\']+)', Path("src/codex_rescue/__init__.py").read_text())
          if not version or version.group(1) != expected:
              raise SystemExit(f"package version does not match {expected!r}")
          PY

      - name: Download exact assets from the GitHub prerelease
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          gh api \
            --header 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > release.json

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("release.json").read_text(encoding="utf-8"))
          expected_tag = os.environ["RELEASE_TAG"]
          version = os.environ["EXPECTED_VERSION"]
          expected_assets = {
              f"codex_rescue-{version}-py3-none-any.whl",
              f"codex_rescue-{version}.tar.gz",
          }
          expected_name = f"Codex Rescue {expected_tag}"
          if data.get("draft") is not False or data.get("prerelease") is not True:
              raise SystemExit("release must be a published prerelease")
          if data.get("tag_name") != expected_tag or data.get("name") != expected_name:
              raise SystemExit("prerelease tag/title mismatch")
          assets = data.get("assets", [])
          names = [asset.get("name") for asset in assets]
          if set(names) != expected_assets or len(names) != len(expected_assets):
              raise SystemExit(f"prerelease assets mismatch: {names!r}")
          for asset in assets:
              if asset["name"] not in expected_assets or not asset.get("id"):
                  raise SystemExit("prerelease asset metadata is incomplete")
          PY

          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          data = json.loads(Path("release.json").read_text(encoding="utf-8"))
          out_dir = Path("dist")
          for asset in data["assets"]:
              output = out_dir / asset["name"]
              with output.open("wb") as stream:
                  subprocess.run(
                      [
                          "gh", "api",
                          "--header", "Accept: application/octet-stream",
                          f"/repos/{os.environ['GITHUB_REPOSITORY']}/releases/assets/{asset['id']}",
                      ],
                      check=True,
                      stdout=stream,
                  )
          PY

      - name: Verify exact artifact SHA256 and metadata
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
          SDIST_SHA256: ${{ inputs.sdist_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          wheel="dist/codex_rescue-${EXPECTED_VERSION}-py3-none-any.whl"
          sdist="dist/codex_rescue-${EXPECTED_VERSION}.tar.gz"
          printf '%s  %s\n' "$WHEEL_SHA256" "$wheel" | sha256sum -c -
          printf '%s  %s\n' "$SDIST_SHA256" "$sdist" | sha256sum -c -
          python3 -m pip install --disable-pip-version-check twine
          python3 -m twine check "$wheel" "$sdist"

      - name: Publish exact artifacts to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
