name: NPM Registry Name Preflight

on:
  push:
    branches: [feat/alpha5-complete]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-registry-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-provisional-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Check provisional package names
        run: node scripts/check_npm_names.mjs
      - name: Record qualification boundary
        if: always()
        run: |
          echo "This workflow never publishes packages." >> "$GITHUB_STEP_SUMMARY"
          echo "An E404 counts as available only when npm returned an unambiguous registry-not-found response." >> "$GITHUB_STEP_SUMMARY"
          echo "A registered name requires authenticated maintainer verification before release." >> "$GITHUB_STEP_SUMMARY"
