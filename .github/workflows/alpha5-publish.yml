name: Publish Alpha5

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published GitHub prerelease tag"
        required: true
        default: "v0.1.0-alpha.5"
      expected_sha:
        description: "Exact commit the tag/release must resolve to"
        required: true
      candidate_run_id:
        description: "Successful Alpha5 Release Candidate workflow run ID"
        required: true

permissions:
  contents: read
  id-token: write

env:
  EXPECTED_TAG: v0.1.0-alpha.5
  EXPECTED_PYTHON_VERSION: 0.1.0a5
  EXPECTED_NPM_VERSION: 0.1.0-alpha.5

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Verify tag and source identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "$EXPECTED_TAG"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$EXPECTED_SHA"
          python - <<'PY'
          import os, re
          from pathlib import Path
          expected = os.environ['EXPECTED_PYTHON_VERSION']
          text = Path('src/codex_rescue/__init__.py').read_text(encoding='utf-8')
          match = re.search(r'__version__\s*=\s*["\']([^"\']+)', text)
          if not match or match.group(1) != expected:
              raise SystemExit(f'Python version mismatch: expected {expected}')
          PY
      - name: Verify candidate run and download exact bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > candidate-run.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('candidate-run.json').read_text())
          if data.get('conclusion') != 'success': raise SystemExit('candidate run is not successful')
          if not str(data.get('path','')).endswith('alpha5-release-candidate.yml'): raise SystemExit('wrong candidate workflow')
          if data.get('head_sha') != os.environ['EXPECTED_SHA']: raise SystemExit('candidate run head SHA mismatch')
          PY
          mkdir candidate
          gh run download "$RUN_ID" -n alpha5-release-bundle -D candidate
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path('candidate')
          manifest=json.loads((root/'release-manifest.json').read_text())
          if manifest.get('source_sha') != os.environ['EXPECTED_SHA']: raise SystemExit('candidate source SHA mismatch')
          if manifest.get('tag') != os.environ['RELEASE_TAG']: raise SystemExit('candidate tag mismatch')
          if manifest.get('python_version') != '0.1.0a5' or manifest.get('npm_version') != '0.1.0-alpha.5': raise SystemExit('candidate version mismatch')
          for name,digest in manifest['files'].items():
              path=root/name
              if not path.is_file(): raise SystemExit(f'missing candidate file {name}')
              actual=hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != digest: raise SystemExit(f'candidate hash mismatch {name}')
          PY
      - name: Verify published GitHub prerelease and download exact assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > release.json
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          rel=json.loads(Path('release.json').read_text())
          manifest=json.loads(Path('candidate/release-manifest.json').read_text())
          if rel.get('draft') is not False or rel.get('prerelease') is not True: raise SystemExit('release must be a published prerelease')
          if rel.get('tag_name') != os.environ['RELEASE_TAG']: raise SystemExit('release tag mismatch')
          if rel.get('target_commitish') != os.environ['EXPECTED_SHA']: raise SystemExit('release target_commitish must be exact SHA')
          expected=set(manifest['files']) | {'release-manifest.json','SHA256SUMS'}
          assets=rel.get('assets',[])
          names={a.get('name') for a in assets}
          if names != expected: raise SystemExit(f'release asset set mismatch: {sorted(names)}')
          expected_hashes=dict(manifest['files'])
          for extra in ('release-manifest.json','SHA256SUMS'):
              expected_hashes[extra]=hashlib.sha256((Path('candidate')/extra).read_bytes()).hexdigest()
          for asset in assets:
              if asset.get('digest') != 'sha256:' + expected_hashes[asset['name']]:
                  raise SystemExit(f'GitHub asset digest mismatch: {asset["name"]}')
          PY
          mkdir release-assets
          gh release download "$RELEASE_TAG" -D release-assets
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest=json.loads(Path('candidate/release-manifest.json').read_text())
          expected=dict(manifest['files'])
          for name,digest in expected.items():
              actual=hashlib.sha256((Path('release-assets')/name).read_bytes()).hexdigest()
              if actual != digest: raise SystemExit(f'downloaded release asset hash mismatch: {name}')
          PY
      - name: Stop if PyPI Alpha5 already exists
        run: |
          python - <<'PY'
          import urllib.error, urllib.request
          url='https://pypi.org/pypi/codex-rescue/0.1.0a5/json'
          try:
              with urllib.request.urlopen(url, timeout=20) as response:
                  if response.status == 200: raise SystemExit('STOP: PyPI codex-rescue 0.1.0a5 already exists')
          except urllib.error.HTTPError as exc:
              if exc.code != 404: raise
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: alpha5-publish-verified-assets
          path: release-assets/*
          if-no-files-found: error

  publish-pypi:
    needs: verify-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: alpha5-publish-verified-assets
          path: release-assets
      - name: Stage exact Python artifacts
        run: |
          mkdir dist
          cp release-assets/codex_rescue-0.1.0a5-py3-none-any.whl dist/
          cp release-assets/codex_rescue-0.1.0a5.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-npm-platforms:
    needs: publish-pypi
    runs-on: ubuntu-latest
    environment:
      name: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: alpha5-publish-verified-assets
          path: release-assets
      - name: Verify npm identity/name gate immediately before first publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm whoami
          node scripts/check_npm_names.mjs
      - name: Publish platform packages in deterministic order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm publish release-assets/codex-rescue-linux-x64-0.1.0-alpha.5.tgz --access public --provenance
          npm publish release-assets/codex-rescue-win32-x64-0.1.0-alpha.5.tgz --access public --provenance
          npm publish release-assets/codex-rescue-darwin-arm64-0.1.0-alpha.5.tgz --access public --provenance
          npm publish release-assets/codex-rescue-darwin-x64-0.1.0-alpha.5.tgz --access public --provenance

  publish-npm-meta:
    needs: publish-npm-platforms
    runs-on: ubuntu-latest
    environment:
      name: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: alpha5-publish-verified-assets
          path: release-assets
      - name: Verify platform versions public and root version still unpublished
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          identity="$(npm whoami)"
          for pkg in codex-rescue-linux-x64 codex-rescue-win32-x64 codex-rescue-darwin-arm64 codex-rescue-darwin-x64; do
            test "$(npm view "${pkg}@0.1.0-alpha.5" version)" = "0.1.0-alpha.5"
            npm view "$pkg" maintainers --json | NPM_ID="$identity" node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=JSON.parse(s);const who=process.env.NPM_ID;const names=(Array.isArray(m)?m:[m]).map(x=>typeof x==="string"?x:x&&x.name);if(!names.includes(who))process.exit(1)})'
          done
          if npm view codex-rescue@0.1.0-alpha.5 version >/dev/null 2>&1; then
            echo "STOP: codex-rescue@0.1.0-alpha.5 already exists" >&2
            exit 1
          fi
      - name: Publish meta package last
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish release-assets/codex-rescue-0.1.0-alpha.5.tgz --access public --provenance
