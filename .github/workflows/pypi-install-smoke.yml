name: PyPI Install Smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    name: smoke (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pipx
        run: python -m pip install --upgrade pipx

      - name: Install codex-rescue via pipx
        run: pipx install codex-rescue

      - name: Verify CLI version
        run: codex-rescue --version

      - name: Verify CLI help
        run: codex-rescue --help

      - name: List pipx packages
        run: pipx list
