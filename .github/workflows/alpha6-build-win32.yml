name: Build Alpha6 Windows Package

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-win32:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install package and PyInstaller
        run: |
          python -m pip install . "pyinstaller==6.22.1"

      - name: Build Windows standalone executable
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --name codex-rescue scripts/native_entry.py

      - name: Test Windows standalone executable
        run: |
          & "dist/codex-rescue.exe" --version
          & "dist/codex-rescue.exe" --help

      - name: Assemble win32-x64 platform package
        run: |
          python scripts/assemble_npm_platform.py --template npm/platforms/win32-x64 --binary dist/codex-rescue.exe --output build/npm-platform

      - name: Pack win32-x64 npm tarball
        working-directory: build/npm-platform
        run: |
          mkdir -p ../tarballs
          npm pack --pack-destination ../tarballs

      - name: Audit win32-x64 npm tarball
        run: |
          python scripts/audit_npm_tarball.py build/tarballs/codex-rescue-win32-x64-0.1.0-alpha.6.tgz --kind platform

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v4
        with:
          name: win32-x64-package
          path: |
            dist/codex-rescue.exe
            build/tarballs/codex-rescue-win32-x64-0.1.0-alpha.6.tgz
