name: Publish Alpha5 to PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published GitHub prerelease tag"
        required: true
        default: "v0.1.0-alpha.5"
      expected_sha:
        description: "Exact commit the tag/release must resolve to"
        required: true
      candidate_run_id:
        description: "Successful Alpha5 Release Candidate workflow run ID"
        required: true

permissions:
  contents: read
  actions: read

env:
  EXPECTED_TAG: v0.1.0-alpha.5
  EXPECTED_PYTHON_VERSION: 0.1.0a5
  TWINE_VERSION: 7.0.0

jobs:
  verify-and-publish-pypi:
    name: Publish codex-rescue 0.1.0a5 to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout exact tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Verify exact tag and source identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "$EXPECTED_TAG"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$EXPECTED_SHA"
          python - <<'PY'
          import os, re
          from pathlib import Path
          expected = os.environ['EXPECTED_PYTHON_VERSION']
          text = Path('src/codex_rescue/__init__.py').read_text(encoding='utf-8')
          match = re.search(r'__version__\s*=\s*["\']([^"\']+)', text)
          if not match or match.group(1) != expected:
              raise SystemExit(f'Python version mismatch: expected {expected}')
          PY

      - name: Verify PyPI 0.1.0a5 does not already exist
        run: |
          python - <<'PY'
          import urllib.error
          import urllib.request
          url = 'https://pypi.org/pypi/codex-rescue/0.1.0a5/json'
          try:
              with urllib.request.urlopen(url, timeout=20) as response:
                  if response.status == 200:
                      raise SystemExit('STOP: PyPI codex-rescue 0.1.0a5 already exists')
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              print('PYPI_ALPHA5_STATE=NOT_FOUND (ready for publication)')
          PY

      - name: Verify candidate run and download exact bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > candidate-run.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('candidate-run.json').read_text())
          if data.get('conclusion') != 'success':
              raise SystemExit('candidate run is not successful')
          if not str(data.get('path', '')).endswith('alpha5-release-candidate.yml'):
              raise SystemExit('wrong candidate workflow')
          if data.get('head_sha') != os.environ['EXPECTED_SHA']:
              raise SystemExit('candidate run head SHA mismatch')
          PY
          mkdir candidate
          gh run download "$RUN_ID" -n alpha5-release-bundle -D candidate
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('candidate')
          manifest = json.loads((root / 'release-manifest.json').read_text())
          if manifest.get('source_sha') != os.environ['EXPECTED_SHA']:
              raise SystemExit('candidate source SHA mismatch')
          if manifest.get('tag') != os.environ['RELEASE_TAG']:
              raise SystemExit('candidate tag mismatch')
          if manifest.get('python_version') != '0.1.0a5':
              raise SystemExit('candidate python_version mismatch')
          for name, digest in manifest['files'].items():
              path = root / name
              if not path.is_file():
                  raise SystemExit(f'missing candidate file {name}')
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f'candidate hash mismatch {name}')
          PY

      - name: Verify published GitHub prerelease and download exact assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > release.json
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          rel = json.loads(Path('release.json').read_text())
          manifest = json.loads(Path('candidate/release-manifest.json').read_text())
          if rel.get('draft') is not False or rel.get('prerelease') is not True:
              raise SystemExit('release must be a published prerelease')
          if rel.get('tag_name') != os.environ['RELEASE_TAG']:
              raise SystemExit('release tag mismatch')
          if rel.get('target_commitish') != os.environ['EXPECTED_SHA']:
              raise SystemExit('release target_commitish must be exact SHA')
          expected = set(manifest['files']) | {'release-manifest.json', 'SHA256SUMS'}
          assets = rel.get('assets', [])
          names = {a.get('name') for a in assets}
          if names != expected:
              raise SystemExit(f'release asset set mismatch: {sorted(names)}')
          expected_hashes = dict(manifest['files'])
          for extra in ('release-manifest.json', 'SHA256SUMS'):
              expected_hashes[extra] = hashlib.sha256((Path('candidate') / extra).read_bytes()).hexdigest()
          for asset in assets:
              if asset.get('digest') != 'sha256:' + expected_hashes[asset['name']]:
                  raise SystemExit(f'GitHub asset digest mismatch: {asset["name"]}')
          PY
          mkdir release-assets
          gh release download "$RELEASE_TAG" -D release-assets
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('candidate/release-manifest.json').read_text())
          for name in ('codex_rescue-0.1.0a5-py3-none-any.whl', 'codex_rescue-0.1.0a5.tar.gz'):
              digest = manifest['files'][name]
              actual = hashlib.sha256((Path('release-assets') / name).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f'downloaded release asset hash mismatch: {name}')
          PY

      - name: Stage and validate Python distributions
        run: |
          set -euo pipefail
          mkdir pypi-dist
          cp release-assets/codex_rescue-0.1.0a5-py3-none-any.whl pypi-dist/
          cp release-assets/codex_rescue-0.1.0a5.tar.gz pypi-dist/
          python -m pip install "twine==${{ env.TWINE_VERSION }}"
          python -m twine check pypi-dist/*

      - name: Publish exact qualified artifacts to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-dist/
